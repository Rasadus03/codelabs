<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5f6368"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e8e3e"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="450" rx="12" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.5"/>
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">Custom Video-Only MP4 Pipeline (Reusable Job Template + Pub/Sub + SSE)</text>

  <!-- GCP Boundary Box -->
  <rect x="330" y="55" width="600" height="370" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="350" y="80" font-size="13" font-weight="700" fill="#1a73e8">Google Cloud Platform</text>

  <!-- Step 0: Custom Template Box -->
  <g filter="url(#shadow)">
    <rect x="365" y="45" width="290" height="58" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="510" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#137333">0. createCustomTemplate.js (One-Time Setup)</text>
    <text x="510" y="88" text-anchor="middle" font-size="11" fill="#3c4043">Template: custom-video-only-mp4-template</text>
  </g>

  <!-- Node 1: React Frontend -->
  <g filter="url(#shadow)">
    <rect x="35" y="145" width="195" height="90" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="132" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">React Frontend</text>
    <text x="132" y="198" text-anchor="middle" font-size="12" fill="#3c4043">custom-vod-frontend</text>
    <text x="132" y="216" text-anchor="middle" font-size="11" fill="#5f6368">EventSource + ReactPlayer</text>
  </g>

  <!-- Node 2: Node.js Backend -->
  <g filter="url(#shadow)">
    <rect x="365" y="145" width="205" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
    <text x="467" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#b06000">Node.js Backend</text>
    <text x="467" y="198" text-anchor="middle" font-size="12" fill="#3c4043">custom-vod-backend</text>
    <text x="467" y="216" text-anchor="middle" font-size="11" fill="#5f6368">Express + SSE + Pub/Sub</text>
  </g>

  <!-- Node 3: Transcoder API -->
  <g filter="url(#shadow)">
    <rect x="700" y="145" width="200" height="90" rx="8" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
    <text x="800" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#137333">Transcoder API</text>
    <text x="800" y="195" text-anchor="middle" font-size="12" fill="#3c4043">720p @ 60fps H.264 (No Audio)</text>
    <text x="800" y="213" text-anchor="middle" font-size="11" fill="#5f6368">Outputs: video.mp4 (hd-mp4)</text>
  </g>

  <!-- Node 4: Raw Videos Bucket -->
  <g filter="url(#shadow)">
    <rect x="700" y="45" width="200" height="58" rx="8" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
    <text x="800" y="71" text-anchor="middle" font-size="13" font-weight="700" fill="#202124">Cloud Storage (Raw)</text>
    <text x="800" y="89" text-anchor="middle" font-size="11" fill="#5f6368">gs://...-custom-raw-videos/</text>
  </g>

  <!-- Node 5: Cloud Pub/Sub -->
  <g filter="url(#shadow)">
    <rect x="520" y="300" width="230" height="85" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
    <text x="635" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#681da8">Cloud Pub/Sub</text>
    <text x="635" y="350" text-anchor="middle" font-size="11" fill="#3c4043">Topic: custom-transcoder-updates</text>
    <text x="635" y="368" text-anchor="middle" font-size="11" fill="#5f6368">Sub: custom-transcoder-updates-sub</text>
  </g>

  <!-- Node 6: Transcoded Bucket + Media CDN -->
  <g filter="url(#shadow)">
    <rect x="35" y="300" width="245" height="85" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="157" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#174ea6">Media CDN &amp; GCS Output</text>
    <text x="157" y="350" text-anchor="middle" font-size="11" fill="#3c4043">gs://...-custom-transcoded-videos/</text>
    <text x="157" y="368" text-anchor="middle" font-size="11" fill="#5f6368">Output file: video.mp4</text>
  </g>

  <!-- Edges -->
  <path d="M 655 74 L 680 74 L 680 160 L 693 160" fill="none" stroke="#1e8e3e" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-green)"/>

  <line x1="230" y1="172" x2="358" y2="172" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="294" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="#1a73e8">1. POST /api/transcode</text>

  <line x1="570" y1="185" x2="692" y2="185" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="631" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#3c4043">2. createJob(templateId)</text>

  <line x1="800" y1="103" x2="800" y2="138" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="852" y="125" text-anchor="middle" font-size="10" fill="#5f6368">Read inputUri</text>

  <path d="M 800 235 L 800 342 L 757 342" fill="none" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="845" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#1e8e3e">3. Job SUCCEEDED</text>

  <path d="M 760 235 L 760 408 L 157 408 L 157 392" fill="none" stroke="#5f6368" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="455" y="423" text-anchor="middle" font-size="11" fill="#5f6368">Write video-only MP4 (video.mp4) to output bucket</text>

  <path d="M 520 342 L 467 342 L 467 242" fill="none" stroke="#9334e6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="295" text-anchor="end" font-size="11" font-weight="700" fill="#681da8">4. Pub/Sub Notification</text>

  <line x1="365" y1="208" x2="237" y2="208" stroke="#1e8e3e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="296" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#1e8e3e">5. SSE (/api/events)</text>

  <line x1="132" y1="235" x2="132" y2="293" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="195" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1a73e8">6. Play Stream</text>
</svg>
